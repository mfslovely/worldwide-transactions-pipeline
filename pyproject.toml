[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldwide-transactions-pipeline"
version = "1.0.0"
description = "Dependency-free synthetic worldwide transaction ETL pipeline"
requires-python = ">=3.10"

[project.scripts]
world-transactions = "world_transactions_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
